name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --base-href /nebula-commerce/

      # GitHub Pages has no SPA rewrites: serve the app for unknown paths so deep links work.
      - name: SPA fallback
        run: cp dist/nebula-commerce/browser/index.html dist/nebula-commerce/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nebula-commerce/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
